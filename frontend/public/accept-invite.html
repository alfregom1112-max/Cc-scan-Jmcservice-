<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Activar cuenta — CedulaScan</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f7fb;color:#102a43;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,480px);background:#fff;border:1px solid #d8e2ec;border-radius:22px;padding:32px;box-shadow:0 18px 45px #102a4314}.logo{width:64px;height:64px;border-radius:19px;background:#0f766e;color:#fff;display:grid;place-items:center;font-weight:900;font-size:21px;margin:0 auto 20px}.kicker{text-align:center;color:#0f766e;font-size:11px;font-weight:900;letter-spacing:2px}.title{text-align:center;font-size:28px;margin:8px 0;color:#102a43}.copy{text-align:center;color:#52667a;line-height:1.5;margin:0 0 24px}.label{display:block;color:#52667a;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px;margin:14px 0 7px}.input{width:100%;border:1px solid #d8e2ec;border-radius:12px;padding:14px;font-size:16px;outline:none}.input:focus{border-color:#0f766e;box-shadow:0 0 0 3px #0f766e22}.button{width:100%;border:0;border-radius:12px;padding:15px;background:#0f766e;color:#fff;font-size:16px;font-weight:800;margin-top:20px;cursor:pointer}.button:disabled{opacity:.6}.status{text-align:center;color:#52667a;line-height:1.5;margin-top:20px}.error{color:#b42318}.success{color:#087443}.hidden{display:none}.small{text-align:center;font-size:13px;color:#52667a;margin-top:18px}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">CS</div><div class="kicker">PLATAFORMA OPERATIVA</div>
    <h1 class="title">Activa tu cuenta</h1>
    <p id="message" class="copy">Validando tu invitación...</p>
    <section id="form" class="hidden">
      <label class="label" for="password">Nueva contraseña</label>
      <input id="password" class="input" type="password" minlength="6" placeholder="Mínimo 6 caracteres">
      <label class="label" for="confirm">Repite la contraseña</label>
      <input id="confirm" class="input" type="password" minlength="6" placeholder="Repite la contraseña">
      <button id="activate" class="button">Activar cuenta</button>
    </section>
    <p id="status" class="status"></p>
    <p class="small">Después de activarla, inicia sesión en la aplicación CedulaScan.</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://jpgutodasjltatrotgdq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwZ3V0b2Rhc2psdGF0cm90Z2RxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNDM5NzUsImV4cCI6MjEwNzcxOTk3NX0.X4M6366FB_Thsw9Z92wC6USATKQ4OtnC3o0nhxEy16o";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const message = document.getElementById("message"), status = document.getElementById("status"), form = document.getElementById("form"), button = document.getElementById("activate");
    const fail = (text) => { message.textContent = text; message.classList.add("error"); };
    (async () => {
      try {
        if (!window.supabase || !window.supabase.createClient) throw new Error("No se pudo cargar el servicio de autenticación. Recarga la página.");
        const query = new URLSearchParams(location.search), hash = new URLSearchParams(location.hash.slice(1));
        const urlError = hash.get("error_description") || query.get("error_description") || hash.get("error_code") || query.get("error_code") || hash.get("error") || query.get("error");
        if (urlError) throw new Error(decodeURIComponent(urlError.replace(/\+/g, " ")));
        const authWork = async () => {
          if (query.get("code")) { const { error } = await supabase.auth.exchangeCodeForSession(query.get("code")); if (error) throw error; }
          else if (query.get("token_hash")) { const { error } = await supabase.auth.verifyOtp({ token_hash: query.get("token_hash"), type: query.get("type") || "invite" }); if (error) throw error; }
          else if (hash.get("access_token")) { const { error } = await supabase.auth.setSession({ access_token: hash.get("access_token"), refresh_token: hash.get("refresh_token") || "" }); if (error) throw error; }
          return supabase.auth.getSession();
        };
        const { data } = await Promise.race([authWork(), new Promise((_, reject) => setTimeout(() => reject(new Error("La validación tardó demasiado. Solicita un enlace nuevo.")), 12000))]);
        if (!data.session) throw new Error("El enlace no es válido, ya fue utilizado o expiró.");
        message.textContent = "Invitación validada. Crea una contraseña para activar tu cuenta."; form.classList.remove("hidden");
      } catch (e) { fail(e.message || "No se pudo validar la invitación."); }
    })();
    button.addEventListener("click", async () => {
      const password = document.getElementById("password").value, confirm = document.getElementById("confirm").value;
      status.className = "status";
      if (password.length < 6) { status.textContent = "La contraseña debe tener al menos 6 caracteres."; status.classList.add("error"); return; }
      if (password !== confirm) { status.textContent = "Las contraseñas no coinciden."; status.classList.add("error"); return; }
      button.disabled = true; status.textContent = "Activando cuenta...";
      const { error } = await supabase.auth.updateUser({ password });
      button.disabled = false;
      if (error) { status.textContent = error.message; status.classList.add("error"); return; }
      status.textContent = "Cuenta activada correctamente. Ya puedes iniciar sesión en CedulaScan."; status.classList.add("success"); form.classList.add("hidden");
    });
  </script>
</body>
</html>
